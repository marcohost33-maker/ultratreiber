name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: suite (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout v7.0.1; full history: the W14 gate and the collector
      # verify that the audited baseline 26309e9 is an ancestor of HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      # actions/setup-node v7.1.0 (cross-runtime interop tests need node)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Test dependency (jsonschema; contract lane skips "NOT green" without it)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -c "import jsonschema"
      - name: Toolchain
        run: |
          python --version
          node --version
          git --version
      - name: Unit test suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      # Issue #2: Git Bash (MSYS2/Cygwin) rewrites the token's default owner to
      # the user SID for every child process, which hid an owner defect that only
      # shows under a native shell with the elevated runner token. Run the suite
      # a second time from pwsh so both default-owner situations are covered.
      - name: Unit test suite (pwsh, native token default owner)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -v
          exit $LASTEXITCODE
      - name: Manifest (SHA256SUMS_W12)
        run: sha256sum -c --strict SHA256SUMS_W12
      - name: W14 portable ACL gate (advisory, never a release approval)
        env:
          PYTHONPATH: .
        run: python tools/w14_acl_static_gate.py

  windows-native-evidence:
    name: native evidence collector (windows-latest)
    runs-on: windows-latest
    # Required since W17 (issue #2 fixed: explicit pipe owner). The hosted runner
    # is Windows Server with an elevated built-in Administrator token, so this is
    # NOT the standard-user Windows 11 evidence and never a release approval.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: OS under test (hosted runner = Windows Server, not Windows 11)
        run: |
          [System.Environment]::OSVersion.VersionString
          python --version
      - name: Collect (47 pinned named-pipe tests)
        run: |
          python tools/w15_windows_evidence.py --collect --repo . --timeout 300 --output "$env:RUNNER_TEMP\udx_native.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\udx_native.json"; exit $LASTEXITCODE }
      # The report deliberately carries no raw test output. When the worker
      # fails, run it once directly so the failing case or the setup error is
      # visible in this (public, synthetic-data-only) CI log.
      - name: Diagnose a failed worker (only on failure)
        if: failure()
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python tools/w15_windows_evidence.py --worker --repo . 2>&1 | Select-Object -Last 40
          python -m unittest discover -s tests -p test_w12_windows_pipe.py -v 2>&1 | Select-String -Pattern 'FAIL|ERROR|Error|Traceback' | Select-Object -First 40
      - name: Verify report against this checkout
        run: |
          python tools/w15_windows_evidence.py --verify "$env:RUNNER_TEMP\udx_native.json" --repo .
          exit $LASTEXITCODE
      # Keep the (redacted, synthetic-data-only) report per commit so the
      # hosted-runner evidence can be re-verified later with --verify.
      # actions/upload-artifact v7.0.1 (pinned; v7.0.2 is younger than our
      # dependency cooldown)
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: udx-native-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/udx_native.json
          if-no-files-found: warn
          retention-days: 30
